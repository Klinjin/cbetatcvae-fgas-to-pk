# config_eighth_gen_compiled_snap82_arcmin_all_noparams.yaml with the target restricted to k in [0, 10] h/Mpc (scripts/kmax10_noparams.py).
# A/B arm (no cosmology): identical to config_eighth_gen_compiled_snap82_arcmin_all.yaml except include_camels_params: false (f_gas profile only).
# A/B (radial design) arm arcmin (all bins): the ARCMIN-design dataset with all 18 bins to the 20 cMpc/h edge
# (scripts/build_dataset_eighth_gen_arcmin.py --all-bins; outer 9 bins vary per sim in angle and radius).
# radial_range_mpch: null (required: radii_mpch is a nominal per-bin median). Otherwise identical to the other arms.
# DataConfig: eighth-gen snap82 dataset built DIRECTLY from the
# producer's compiled f_gas files
#   DeltaSigma_kSZ_over_DeltaSigma_total_profiles_snap82_nd_*_n_*_eighth_gen.npz
# (comoving Mpc/h design, halos ranked by saved stellar mass at production) by
# scripts/build_dataset_eighth_gen_compiled.py.
#
# number_density_indices [2] -> n = 8.0e-3 (Mpc/h)^-3, 1000 halos (snap82 bins).
# Target: full SP(k) curve, 255 bins 0.178 -- 32.1 h/Mpc (Pk_512_3Dfield grid).
# Caveat (CLAUDE.md): SP(k) = P_total/P_DM within the hydro run is a proxy that
# biases at k >~ 5 h/Mpc in a feedback-correlated way.
#
#     python scripts/run.py --config-data scripts/configs/data/config_eighth_gen_compiled_snap82.yaml \
#                           --config-run  scripts/configs/run/cvae_noise.yaml

