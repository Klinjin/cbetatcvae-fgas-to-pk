# A/B (radial design) arm mpch: config_eighth_gen_compiled_snap74.yaml with radial_range_mpch: null (all 20 comoving bins, 0.1 -- 20 Mpc/h).
# DataConfig: eighth-gen snap74 dataset (tag 20260930) built DIRECTLY from the
# producer's compiled f_gas files
#   DeltaSigma_kSZ_over_DeltaSigma_total_profiles_snap74_nd_*_n_*_eighth_gen.npz
# (comoving Mpc/h design, halos ranked by saved stellar mass at production) by
# scripts/build_dataset_eighth_gen_compiled.py.
#
# number_density_indices [2] -> n = 5.0e-4 (Mpc/h)^-3, 62 halos (snap74 bins).
# Target: full SP(k) curve, 255 bins 0.178 -- 32.1 h/Mpc (Pk_512_3Dfield grid).
# Caveat (CLAUDE.md): SP(k) = P_total/P_DM within the hydro run is a proxy that
# biases at k >~ 5 h/Mpc in a feedback-correlated way.
#
#     python scripts/run.py --config-data scripts/configs/data/config_eighth_gen_compiled_snap74.yaml \
#                           --config-run  scripts/configs/run/cvae_noise.yaml

